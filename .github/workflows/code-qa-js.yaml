name: Code Quality Assurance - JavaScript/TypeScript

on:
  push:
    branches: [main]
    paths:
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/workflows/code-qa-js.yaml"
      - "cypress/**"
      - "cypress.config.ts"
      - "esbuild.js"
      - "jest.config.js"
      - "package*.json"
      - "src/**"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".github/workflows/code-qa-js.yaml"
      - "cypress/**"
      - "cypress.config.ts"
      - "esbuild.js"
      - "jest.config.js"
      - "package*.json"
      - "src/**"
      - "tsconfig*.json"

permissions:
  contents: read
jobs:
  code-quality-js-ts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup Node.js environment for TypeScript/JavaScript development
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # The Cypress binary lives outside node_modules, so it is cached on its own.
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # npm may hold back install scripts until they are approved, and Cypress downloads its binary
      # in one; this installs it either way, and is a no-op when the cache already holds it.
      - name: Install Cypress binary
        run: npx cypress install

      # Builds the desktop and web bundles
      - name: Build extension
        run: npm run compile

      # Run JavaScript/TypeScript specific checks
      - name: Code formatting check
        run: npm run prettier:check

      - name: TypeScript type check
        run: npm run check-types

      - name: ESLint check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:jest

      # Jest excludes *.e2e.test.ts, so these are the only jobs that run the extension inside a real
      # VS Code. Desktop VS Code needs a display; the web suite is already headless Chromium.
      - name: Run desktop extension tests
        run: xvfb-run -a npm run test:extension

      - name: Run web extension tests
        run: npm run test:web

      # Drives the Wiki Site webview in a standalone harness page with a fake extension host, since
      # Cypress cannot drive VS Code itself.
      - name: Run Wiki Site webview tests
        run: xvfb-run -a npm run test:cypress

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
